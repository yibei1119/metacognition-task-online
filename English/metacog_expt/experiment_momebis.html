//CODE THAT CHECKS IF THE BROWSER IS CHROME OR FIREFOX MOZ
function getBrowserInfo() 
{ 
        var ua = navigator.userAgent, tem, 
        M = ua.match(/(opera|chrome|safari|firefox|msie|trident(?=\/))\/?\s*(\d+)/i) || []; 
        if(/trident/i.test(M[1])) 
        { 
                tem=  /\brv[ :]+(\d+)/g.exec(ua) || []; 
                return 'IE '+(tem[1] || ''); 
        } 
        if(M[1]=== 'Chrome') 
        { 
                tem= ua.match(/\b(OPR|Edge)\/(\d+)/); 
                if(tem!= null) return tem.slice(1).join(' ').replace('OPR', 'Opera'); 
        } 
        M = M[2]? [M[1], M[2]]: [navigator.appName, navigator.appVersion, '-?']; 
        if((tem= ua.match(/version\/(\d+)/i))!= null) 
                M.splice(1, 1, tem[1]); 
        return { 'browser': M[0], 'version': M[1] }; 
}

//SAVE DATA TO DATAPIPE (-> OSF)
//DataPipe writes one NEW file per POST and refuses duplicate filenames,
//so every upload gets a unique name. dataAsCSV() always returns ALL data

//and the earlier "checkpoint" files are only insurance against drop-outs.

var DATAPIPE_ID = "o0RPg1oBMGvI";

function saveToDataPipe(tag, done) {
  fetch('https://pipe.jspsych.org/api/data/', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Accept': '*/*' },
    body: JSON.stringify({
      experimentID: DATAPIPE_ID,

      data: jsPsych.data.dataAsCSV()
    })
  })
  .then(function (r) { return r.json(); })
  .then(function (res) { console.log('[datapipe ' + tag + ']', res); if (done) done(); })
  .catch(function (e) { console.error('[datapipe ' + tag + '] failed', e); if (done) done(); });
}
